---
layout: default
---

<article class="post-detail section">
  <div class="container">
    <div class="post-header">
      <a href="{{ '/posts/' | relative_url }}" class="back-link">← Back to Posts</a>
      
      <div class="post-meta">
        <span class="post-date">{{ page.date | date: "%B %d, %Y" }}</span>
        <span class="post-author">{{ page.author | default: site.profile.name }}</span>
      </div>

      <h1 class="post-title">{{ page.title }}</h1>

      {% if page.image %}
      <div class="post-image">
        <img 
          src="{{ page.image | relative_url }}" 
          alt="{{ page.title }}"
          loading="eager"
        />
      </div>
      {% endif %}

      {% if page.tags %}
      <div class="post-tags">
        {% for tag in page.tags %}
          <span class="tag">{{ tag }}</span>
        {% endfor %}
      </div>
      {% endif %}
    </div>

    <div class="post-content">
      <div class="post-body">
        {{ content }}
      </div>
    </div>
  </div>
</article>
